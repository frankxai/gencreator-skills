schema_version: "1.1"
name: studio-trigger-prep-episode
description: Should trigger studio-session.
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "I want to film an episode about my morning routine tomorrow, can you prep the slides and a teleprompter so I just have to talk"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?studio-session"'
