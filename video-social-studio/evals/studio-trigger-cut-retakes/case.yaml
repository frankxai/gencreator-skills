schema_version: "1.1"
name: studio-trigger-cut-retakes
description: Should trigger studio-session.
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "I just recorded my episode with the presenter and pressed M every time I messed up, now cut out the retakes"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?studio-session"'
