schema_version: "1.1"
name: studio-no-trigger-trim-clip
description: "Should NOT trigger studio-session."
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "trim the first 10 seconds off vlog.mp4"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?studio-session"'
    min: 0
    max: 0
